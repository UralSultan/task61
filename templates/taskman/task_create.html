{% extends 'base.html' %}

{% block title %}Создать задачу{% endblock %}

{% block content %}
<h2>Создать задачу</h2>
{% if project %}
    <p><strong>Проект:</strong> {{ project.title }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Создать</button>
    {% if project %}
        <a href="{% url 'taskman:project_detail' project.pk %}" class="btn">Отмена</a>
    {% else %}
        <a href="{% url 'taskman:task_list_all' %}" class="btn">Отмена</a>
    {% endif %}
</form>
{% endblock %}
